# ======================================================================
# 社内お知らせ掲示板 バックエンド 本番(ローカル実行)設定
# ======================================================================

# サーバポート（フロントエンドの開発オリジン http://localhost:5173 から呼び出す）
server.port=8080

# ----------------------------------------------------------------------
# H2 データベース（ファイルモード）
#   アプリ再起動後もデータを保持する [NFR1]
#   ./data/announcement_board.* にファイルが作成される
# ----------------------------------------------------------------------
spring.datasource.url=jdbc:h2:file:./data/announcement_board;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate
#   スキーマはエンティティから自動生成・更新（学習用途のため update）
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.open-in-view=false

# 開発時のSQL可視化（本文全文などの機微情報はログに残さない方針 [NFR-SEC.8]）
spring.jpa.show-sql=false

# ----------------------------------------------------------------------
# サンプル初期データ（data.sql）の投入
#   Hibernate によるスキーマ生成の「後」に data.sql を実行する。
#   defer-datasource-initialization=true が無いと、ddl-auto=update の環境では
#   data.sql がテーブル生成前に走り「テーブルが無い」エラーになる。
#   data.sql 側は「空のときだけ投入」する冪等SQLのため、既存データがあれば何もしない。
# ----------------------------------------------------------------------
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# H2 コンソール（ローカル開発の確認用。必要なければ false）
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# フロントエンド開発オリジン（CORS 許可。ワイルドカード全許可はしない [NFR-SEC.10]）
app.cors.allowed-origin=http://localhost:5173

# ----------------------------------------------------------------------
# ロギング [Observability Setup]
#   方針: サービスロジック（CRUD）の処理トレースと例外のみを残す。
#   起動・成功通知などのイベントログは出さない。
#   トレースは DEBUG、業務例外（検証失敗・未検出）は WARN。
#   ログ衛生: メソッド名・ID・件数のみ。本文/タイトル等の入力値は出さない [NFR-SEC.8]。
# ----------------------------------------------------------------------
# サービス層のトレース（DEBUG）を表示
logging.level.com.example.announcementboard.service=DEBUG
# フレームワークの冗長なイベントログは抑制（既定の INFO 起動ログを減らす）
logging.level.org.springframework=WARN
logging.level.org.hibernate=WARN
