# 社内お知らせ掲示板 — Nginx 設定（EC2 単一ホスト構成）
# 配置先: /etc/nginx/conf.d/announcement.conf
# 役割:
#   /      → フロントの静的ファイル（/var/www/announcement）を配信（SPA フォールバック付き）
#   /api/  → バックエンド（localhost:8080, Spring Boot）へリバースプロキシ
# これによりフロントと API が同一オリジンになり、ブラウザの CORS 設定が不要になる。

server {
    listen 80;
    server_name _;      # 独自ドメインがあれば announcement.example.com に変更

    root /var/www/announcement;
    index index.html;

    # フロント（SPA）。実ファイルが無いパスは index.html にフォールバック
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API はバックエンド(8080)へ中継
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
